[project]
name = "curiosity-aftershocks"
version = "1.0.0"
description = "A Spark-powered observatory of collective curiosity"
requires-python = ">=3.11,<3.14"
dependencies = ["pyspark==4.0.1", "numpy>=2.1,<3", "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
